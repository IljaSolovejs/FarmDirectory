<div class="footer-meta-grid">
    {% if authors %}
    <div class="footer-meta-section">
        <span class="footer-meta-label">Authors</span>
        <ul class="footer-meta-list">
            {% for author in authors %}<li>{{ author }}</li>{% endfor %}
        </ul>
    </div>
    {% endif %}
    {% if references %}
    <div class="footer-meta-section">
        <span class="footer-meta-label">References</span>
        <ol class="footer-meta-list">
            {% for reference in references %}<li>{{ reference }}</li>{% endfor %}
        </ol>
    </div>
    {% endif %}
</div>
